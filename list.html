<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素材一覧 | AI Material Archive</title>
    <meta name="description" content="AI Material Archiveのカテゴリ別素材一覧ページ。商用利用OK・登録不要のフリー素材。">

    <!-- 🚀 パフォーマンス改善：CDNへの事前接続（preconnect）で読み込みのワンテンポを解消 -->
    <link rel="preconnect" href="https://cdn.discordapp.com">
    <link rel="preconnect" href="https://media.discordapp.net">
    <link rel="preconnect" href="https://material-proxy.tutchimikadoseimei.workers.dev">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html">AI Material Archive</a></div>
        <nav>
            <a href="index.html">ホーム</a>
            <a href="index.html#bgm-section">🎵 BGM</a>
            <a href="index.html#bg-section">🖼️ 背景</a>
            <a href="index.html#favorites-section">❤️ お気に入り</a>
            <a href="index.html#search-input" onclick="window.location.href='index.html#search-input'; return true;">🔍 検索</a>
            <a href="terms.html">利用規約</a>
        </nav>
    </header>

    <div class="container">
        <h2 id="category-title" class="section-title">📂 素材一覧</h2>
        <p id="category-description" style="color: var(--text-secondary); margin-bottom: 30px;">指定されたカテゴリの素材を表示しています。</p>

        <!-- 該当素材の一覧 -->
        <div id="list-container" class="material-grid">
            <p style="color: var(--text-secondary);">読み込み中...</p>
        </div>

        <div style="margin-top: 50px; text-align: center;">
            <a href="index.html" class="action-btn" style="display: inline-block; padding: 10px 20px; text-decoration: none;">トップページへ戻る</a>
        </div>
    </div>

    <!-- 🎵 音量・ループ機能搭載カスタムプレイヤーバー -->
    <div id="sticky-player-bar" class="sticky-player-bar" style="display: none;">
        <div class="player-info">
            <span id="sticky-title" class="player-title">曲名を選択してください</span>
            <span id="sticky-category" class="player-category">-</span>
        </div>
        
        <div class="player-controls-group">
            <button id="back-30-btn" class="wmp-btn" title="30秒戻し"><<</button>
            <button id="back-10-btn" class="wmp-btn" title="10秒戻し"><</button>
            <button id="play-pause-btn" class="wmp-btn main-play" title="再生/一時停止">▶</button>
            <button id="forward-10-btn" class="wmp-btn" title="10秒送り">></button>
            <button id="forward-30-btn" class="wmp-btn" title="30秒送り">>></button>
            <button id="loop-btn" class="wmp-btn" title="ループ再生切り替え">🔁</button>

            <div class="progress-container">
                <span id="current-time" class="time-display">0:00</span>
                <div id="progress-bar" class="progress-bar">
                    <div id="progress-filled" class="progress-filled"></div>
                </div>
                <span id="total-time" class="time-display">0:00</span>
            </div>

            <div class="volume-container">
                <span style="font-size:0.8rem;">🔊</span>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
            </div>
        </div>

        <div class="player-action">
            <a id="sticky-download-btn" href="#" class="action-btn">無料ダウンロードへ</a>
        </div>

        <!-- 非表示の音声エンジン（preload="none"で不要な読み込みをカット） -->
        <audio id="hidden-audio" preload="none"></audio>
    </div>

    <script src="app.js"></script>
</body>
</html>
