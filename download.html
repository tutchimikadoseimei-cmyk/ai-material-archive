<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素材ダウンロード | AI Material Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html">AI Material Archive</a></div>
        <nav>
            <a href="index.html">ホームに戻る</a>
            <a href="terms.html">利用規約</a>
        </nav>
    </header>

    <div class="container" style="max-width: 800px; text-align: center;">
        <div class="hero-section" style="padding: 40px 20px;">
            <span id="item-channel" class="card-header-tag" style="display:inline-block; margin-bottom:10px;">🎵 BGM</span>
            <h2 id="item-title" class="hero-title" style="font-size: 1.8rem; margin-bottom: 10px;">素材を読み込み中...</h2>
            <p id="item-tags" class="hero-subtitle" style="margin-bottom: 25px;">-</p>

            <!-- プレビュー表示エリア（安全なDOM生成） -->
            <div id="item-preview" style="margin: 30px 0; display: flex; justify-content: center;">
                <!-- 動的プレビュー -->
            </div>

            <!-- ダウンロードボタン -->
            <div style="margin-top: 30px;">
                <button id="download-btn" class="action-btn" style="font-size: 1.1rem; padding: 14px 32px; display: inline-block; cursor: pointer; border: none;">
                    📥 ダウンロード 📥
                </button>
            </div>

            <!-- 🤝 エンゲージメント機能エリア -->
            <div style="margin-top: 40px; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; border-top: 1px solid var(--border-color); padding-top: 30px;">
                <button id="copy-credit-btn" class="action-btn" style="background: #334155; color: #38bdf8; border: 1px solid #475569;">
                    📋 クレジット表記をコピー
                </button>
                <button id="share-twitter-btn" class="action-btn" style="background: #0f172a; color: #f8fafc; border: 1px solid #334155;">
                    𝕏 でこの素材をシェア
                </button>
            </div>
        </div>
    </div>

    <!-- 📋 コピー通知用トースト -->
    <div id="toast" class="toast-notification">クリップボードにコピーしました！</div>

    <footer>
        <p>&copy; 2026 AI Material Archive. All rights reserved. | <a href="terms.html">利用規約</a></p>
    </footer>

    <script>
        // 🔒 URLパラメータの安全な取得と検証
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title') || 'AI素材';
        const channel = params.get('channel') || 'AI Material Archive';
        const type = params.get('type') || 'bgm';
        const rawUrl = params.get('url');
        const tags = params.get('tags') || '';

        // 🔒 textContentによる完全に安全なテキスト反映（XSS完全防止）
        document.getElementById('item-title').textContent = title;
        document.getElementById('item-channel শক্তির').textContent = `${type === 'image' ? '🖼️' : '🎵'} ${channel}`;
        document.getElementById('item-tags').textContent = tags;

        const previewBox = document.getElementById('item-preview');
        const downloadBtn = document.getElementById('download-btn');

        // 🔒 URLスキーム検証（javascript: や data: などの危険なスキームを完全にブロック）
        function isValidUrl(url) {
            if (!url) return false;
            try {
                const parsed = new URL(url, window.location.origin);
                return parsed.protocol === 'http:' || parsed.protocol === 'https:';
            } catch (e) {
                return false;
            }
        }

        let targetFileUrl = isValidUrl(rawUrl) ? rawUrl : '';

        if (targetFileUrl) {
            previewBox.innerHTML = ''; // クリア

            // 🔒 innerHTMLを使わず安全なDOM要素生成でプレビューを構築
            if (type === 'bgm') {
                const audioEl = document.createElement('audio');
                audioEl.controls = true;
                audioEl.src = targetFileUrl;
                audioEl.style.cssText = 'width: 100%; max-width: 500px;';
                audioEl.onerror = () => {
                    previewBox.innerHTML = '';
                    const errP = document.createElement('p');
                    errP.style.cssText = 'color: var(--heart-color); font-size: 0.9rem;';
                    errP.textContent = '⚠️ 音声ファイルの読み込みに失敗しました（リンクの有効期限切れの可能性があります）。';
                    previewBox.appendChild(errP);
                };
                previewBox.appendChild(audioEl);
            } else {
                const imgEl = document.createElement('img');
                imgEl.src = targetFileUrl;
                imgEl.alt = title;
                imgEl.style.cssText = 'max-width: 100%; max-height: 400px; border-radius: 8px;';
                imgEl.onerror = () => {
                    previewBox.innerHTML = '';
                    const errP = document.createElement('p');
                    errP.style.cssText = 'color: var(--heart-color);';
                    errP.textContent = '⚠️ 画像ファイルの読み込みに失敗しました。';
                    previewBox.appendChild(errP);
                };
                previewBox.appendChild(imgEl);
            }

            // 📥 確実にダウンロードさせる処理（Blob化）
            downloadBtn.addEventListener('click', async () => {
                downloadBtn.textContent = "📥 ダウンロード中...";
                downloadBtn.style.opacity = "0.7";
                try {
                    const response = await fetch(targetFileUrl);
                    if (!response.ok) throw new Error('Network response was not ok');
                    const blob = await response.blob();
                    const blobUrl = window.URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    
                    let ext = type === 'image' ? '.png' : '.mp3';
                    if (targetFileUrl.includes('.jpg') || targetFileUrl.includes('.jpeg')) ext = '.jpg';
                    if (targetFileUrl.includes('.webp')) ext = '.webp';
                    if (targetFileUrl.includes('.wav')) ext = '.wav';

                    // 🔒 ファイル名のサニタイズ（安全なファイル名にする）
                    const safeTitle = title.replace(/[/\\?%*:|"<>]/g, '_');
                    a.download = `${safeTitle}${ext}`;
                    document.body.appendChild(a);
                    a.click();
                    
                    a.remove();
                    window.URL.revokeObjectURL(blobUrl);
                } catch (err) {
                    console.error("ダウンロードに失敗しました。別タブで開きます:", err);
                    window.open(targetFileUrl, '_blank');
                } finally {
                    downloadBtn.textContent = "📥 ダウンロード 📥";
                    downloadBtn.style.opacity = "1";
                }
            });

        } else {
            document.getElementById('item-title').textContent = "有効なファイルが見つかりませんでした";
            downloadBtn.style.display = "none";
        }

        // 📋 クレジットコピー機能
        document.getElementById('copy-credit-btn').addEventListener('click', () => {
            const creditType = type === 'image' ? '画像' : 'BGM';
            const creditText = `${creditType}: ${title} (${channel} / AI Material Archive)`;
            navigator.clipboard.writeText(creditText).then(() => {
                showToast("クレジットをコピーしました！");
            });
        });

        // 𝕏 シェア機能
        document.getElementById('share-twitter-btn').appendEventListener?.('click', () => {});
        document.getElementById('share-twitter-btn').addEventListener('click', () => {
            const shareUrl = window.location.href;
            const tweetText = encodeURIComponent(`【無料AI素材】「${title}」を見つけました！\n#AI素材 #フリー素材`);
            window.open(`https://twitter.com/intent/tweet?text=${tweetText}&url=${encodeURIComponent(shareUrl)}`, '_blank');
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
