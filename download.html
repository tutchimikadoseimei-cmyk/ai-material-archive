<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素材ダウンロード | AI Material Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><a href="index.html">AI Material Archive</a></div>
        <nav>
            <a href="index.html">ホームに戻る</a>
            <a href="terms.html">利用規約</a>
        </nav>
    </header>

    <div class="container" style="max-width: 800px; text-align: center;">
        <div class="hero-section" style="padding: 40px 20px;">
            <span id="item-channel" class="card-header-tag" style="display:inline-block; margin-bottom:10px;">🎵 BGM</span>
            <h2 id="item-title" class="hero-title" style="font-size: 1.8rem; margin-bottom: 10px;">素材を読み込み中...</h2>
            <p id="item-tags" class="hero-subtitle" style="margin-bottom: 25px;">-</p>

            <!-- プレビュー表示エリア -->
            <div id="item-preview" style="margin: 30px 0; display: flex; justify-content: center;">
                <!-- 動的プレビュー -->
            </div>

            <!-- ダウンロードボタン -->
            <div style="margin-top: 30px;">
                <a id="download-btn" href="#" class="action-btn" style="font-size: 1.1rem; padding: 14px 32px; display: inline-block; text-decoration: none;" download>
                    📥 ダウンロード 📥
                </a>
            </div>

            <!-- 🤝 エンゲージメント機能エリア（コピー＆シェア） -->
            <div style="margin-top: 40px; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; border-top: 1px solid var(--border-color); padding-top: 30px;">
                <button id="copy-credit-btn" class="action-btn" style="background: #334155; color: #38bdf8; border: 1px solid #475569;">
                    📋 クレジット表記をコピー
                </button>
                <button id="share-twitter-btn" class="action-btn" style="background: #0f172a; color: #f8fafc; border: 1px solid #334155;">
                    𝕏 でこの素材をシェア
                </button>
            </div>
        </div>
    </div>

    <!-- 📋 コピー通知用トースト -->
    <div id="toast" class="toast-notification">クリップボードにコピーしました！</div>

    <footer>
        <p>&copy; 2026 AI Material Archive. All rights reserved. | <a href="terms.html">利用規約</a></p>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title') || 'AI素材';
        const channel = params.get('channel') || 'AI Material Archive';
        const type = params.get('type') || 'bgm';
        const url = params.get('url');
        const tags = params.get('tags') || '';

        document.getElementById('item-title').textContent = title;
        document.getElementById('item-channel').textContent = `🎵 ${channel}`;
        document.getElementById('item-tags').textContent = tags;

        const previewBox = document.getElementById('item-preview');
        const downloadBtn = document.getElementById('download-btn');

        if (url && url !== 'null' && url !== '') {
            if (type === 'bgm') {
                previewBox.innerHTML = `<audio controls src="${url}" style="width: 100%; max-width: 500px;" onerror="showAudioError()"></audio>`;
            } else {
                previewBox.innerHTML = `<img src="${url}" alt="${title}" style="max-width: 100%; max-height: 400px; border-radius: 8px;" onerror="this.outerHTML='<p style=\'color:var(--heart-color);\'>⚠️ 画像ファイルの読み込みに失敗しました。</p>';">`;
            }
            downloadBtn.href = url;
        } else {
            document.getElementById('item-title').textContent = "有効なファイルが見つかりませんでした";
            downloadBtn.style.display = "none";
        }

        function showAudioError() {
            previewBox.innerHTML = `<p style="color: var(--heart-color); font-size: 0.9rem;">⚠️ 音声ファイルの読み込みに失敗しました（リンクの有効期限切れの可能性があります）。</p>`;
        }

        // 📋 クレジットコピー機能
        document.getElementById('copy-credit-btn').addEventListener('click', () => {
            const creditText = `BGM: ${title} (${channel} / AI Material Archive)`;
            navigator.clipboard.writeText(creditText).then(() => {
                showToast("クレジットをコピーしました！");
            });
        });

        // 𝕏 シェア機能
        document.getElementById('share-twitter-btn').addEventListener('click', () => {
            const shareUrl = window.location.href;
            const tweetText = encodeURIComponent(`【無料AI素材】「${title}」を見つけました！\n#AI素材 #BGM #フリー素材`);
            window.open(`https://twitter.com/intent/tweet?text=${tweetText}&url=${encodeURIComponent(shareUrl)}`, '_blank');
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
